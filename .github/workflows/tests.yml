name: Unit tests and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/test_desk_loader.cjs
      - run: python scripts/run_ci.py python -m pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - name: Check Desk JavaScript
        run: find revolut_bank_feed -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Build and verify distributions
        run: |
          python -m build
          python scripts/check_dist.py
      - uses: actions/upload-artifact@v4
        with:
          name: revolut-distributions-python-${{ matrix.python }}
          path: dist/*

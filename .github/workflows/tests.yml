name: Unit tests and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/test_desk_loader.cjs
      - name: Unit tests
        run: |
          set -o pipefail
          if python -m pytest -q 2>&1 | tee ci-output.log; then
            status=0
          else
            status=$?
          fi
          if [ "$status" -ne 0 ]; then
            message=$(tail -c 3500 ci-output.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error::${message}"
          fi
          rm -f ci-output.log
          exit "$status"
      - run: ruff check .
      - run: ruff format --check .
      - name: Check Desk JavaScript
        run: find revolut_bank_feed -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Build and verify distributions
        run: |
          python -m build
          python scripts/check_dist.py
      - uses: actions/upload-artifact@v4
        with:
          name: revolut-distributions-python-${{ matrix.python }}
          path: dist/*

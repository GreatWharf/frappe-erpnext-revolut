name: Frappe integration
on:
  workflow_dispatch:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - frappe: version-15
            python: '3.10'
            node: '20'
            mariadb: '10.6'
          - frappe: version-16
            python: '3.14'
            node: '24'
            mariadb: '11.8'
    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: test-root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis-cache:
        image: redis:7-alpine
        ports: ['13000:6379']
      redis-queue:
        image: redis:7-alpine
        ports: ['11000:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client libmariadb-dev pkg-config libcups2-dev
          npm install -g yarn
          python -m pip install frappe-bench
      - name: Initialize isolated bench
        working-directory: ${{ runner.temp }}
        env:
          FRAPPE_BRANCH: ${{ matrix.frappe }}
        run: |
          bench init --frappe-branch "$FRAPPE_BRANCH" --skip-redis-config-generation --skip-assets feed-bench
          cd feed-bench
          bench set-config -g redis_cache redis://127.0.0.1:13000
          bench set-config -g redis_queue redis://127.0.0.1:11000
          bench set-config -g redis_socketio redis://127.0.0.1:11000
          bench get-app --branch "$FRAPPE_BRANCH" https://github.com/frappe/erpnext
          bench get-app "$GITHUB_WORKSPACE"
          bench new-site test.localhost --db-host 127.0.0.1 --db-root-username root --db-root-password test-root --admin-password test-admin
          bench --site test.localhost install-app erpnext
          bench --site test.localhost install-app revolut_bank_feed
          bench --site test.localhost set-config allow_tests true
          bench --site test.localhost migrate
      - name: Test actual ERPNext Bank Transaction lifecycle
        working-directory: ${{ runner.temp }}/feed-bench
        run: |
          set -o pipefail
          if bench --site test.localhost run-tests --app revolut_bank_feed --module revolut_bank_feed.tests.test_integration 2>&1 | tee ci-output.log; then
            status=0
          else
            status=$?
          fi
          if [ "$status" -ne 0 ]; then
            message=$(tail -c 3500 ci-output.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error::${message}"
          fi
          rm -f ci-output.log
          exit "$status"

name: Frappe v16 integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'revolut_bank_feed/**'
      - '.github/workflows/bench-integration.yml'
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: test-root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis-cache:
        image: redis:7-alpine
        ports: ['13000:6379']
      redis-queue:
        image: redis:7-alpine
        ports: ['11000:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client libmariadb-dev pkg-config libcups2-dev
          npm install -g yarn
          python -m pip install frappe-bench
      - name: Initialize isolated bench
        working-directory: ${{ runner.temp }}
        run: |
          bench init --frappe-branch version-16 --skip-redis-config-generation --skip-assets feed-bench
          cd feed-bench
          bench set-config -g redis_cache redis://127.0.0.1:13000
          bench set-config -g redis_queue redis://127.0.0.1:11000
          bench set-config -g redis_socketio redis://127.0.0.1:11000
          bench get-app --branch version-16 https://github.com/frappe/erpnext
          bench get-app "$GITHUB_WORKSPACE"
          bench new-site test.localhost --db-host 127.0.0.1 --db-root-username root --db-root-password test-root --admin-password test-admin
          bench --site test.localhost install-app erpnext
          bench --site test.localhost install-app revolut_bank_feed
          bench --site test.localhost set-config allow_tests true
          bench --site test.localhost migrate
      - name: Test actual ERPNext Bank Transaction lifecycle
        working-directory: ${{ runner.temp }}/feed-bench
        run: bench --site test.localhost run-tests --app revolut_bank_feed --module revolut_bank_feed.tests.test_integration

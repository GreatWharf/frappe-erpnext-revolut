[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revolut_bank_feed"
version = "0.4.4"
description = "Read-only Revolut Business bank feed for ERPNext v16"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
authors = [{name = "Revolut Bank Feed contributors"}]
dependencies = ["requests>=2.31,<3", "PyJWT[crypto]>=2.8,<3", "cryptography>=42,<51"]

[project.optional-dependencies]
test = ["pytest>=8.4,<10", "ruff>=0.14", "build>=1,<2"]

[tool.setuptools.packages.find]
include = ["revolut_bank_feed*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.js", "*.txt", "*.html", "*.css", "*.md", "*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<17.0.0-dev"
